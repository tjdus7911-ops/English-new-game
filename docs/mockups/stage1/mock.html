<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2b2118;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;color:#4A3220}
.scr{position:relative;width:1536px;height:864px;overflow:hidden;background:#3E4E2C}
.full{position:absolute;inset:0;width:100%;height:100%}
.serif{font-family:'Noto Serif CJK KR','Noto Serif CJK SC',serif}
.panel{background:linear-gradient(180deg,#FBF3E2,#F1E2C4);border:3px solid #C9A46A;box-shadow:0 10px 30px -10px rgba(60,35,15,.55),inset 0 0 0 2px #FFF8EA;border-radius:26px}
.chip{background:rgba(251,243,226,.96);border:2px solid #C9A46A;box-shadow:0 4px 12px -4px rgba(60,35,15,.45);border-radius:999px}
.btn-gold{background:linear-gradient(180deg,#F3D58C,#C99A45);color:#4A2E12;border:3px solid #FFF3D6;box-shadow:0 5px 0 #8E6526,0 8px 18px -6px rgba(120,80,20,.6);border-radius:22px;font-weight:900}
.btn-sage{background:linear-gradient(180deg,#7E9A6A,#566F45);color:#FFF8EA;border:3px solid #E2C27E;box-shadow:0 5px 0 #3D5030;border-radius:22px;font-weight:900}
.ico{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(60,35,15,.35))}
.menu{position:absolute;left:18px;top:150px;display:flex;flex-direction:column;gap:14px}
.menu .m{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:800;position:relative}
.badge{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:#C8452F;color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.top-l{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:12px;padding:8px 22px 8px 8px}
.top-r{position:absolute;right:18px;top:16px;display:flex;gap:10px}
.rooms{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:8px;padding:8px}
.room{width:104px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:#FFF8EA;border:2px solid #E3CFA6;color:#6B4A2E;gap:2px}
.room.on{background:linear-gradient(180deg,#F3D58C,#DDB467);border-color:#fff;box-shadow:0 0 0 3px #C99A45}
.room.lock{background:#E9DFCD;color:#9C8A70}
.room small{font-size:11px;font-weight:700}
.label{position:absolute;transform:translate(-50%,-50%);padding:6px 14px;font-weight:800;font-size:16px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.label img{width:22px;height:22px}
.cloud{position:absolute;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(60,40,30,.25))}
.cap{position:absolute;left:0;right:0;bottom:-58px;color:#F6EAD3;font-size:20px;text-align:center}
.note{position:absolute;padding:8px 12px;border-radius:12px;background:#2E6FD8;color:#fff;font-size:14px;font-weight:700;max-width:260px;line-height:1.35;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.note::before{content:'시안 메모';display:block;font-size:11px;opacity:.8}
</style></head><body>
<div id="root"></div>
<script>
const MAP='../../../public/assets/game/map/mansion.webp', A='../../../public/assets/game/';
const icon=n=>`${A}a/icon-${n}.webp`;
// 방 폴리곤 (지도 px)
const P={
 living:[[165,410],[295,230],[600,258],[608,415],[705,420],[712,545],[660,560],[520,580],[205,525]],
 kitchen:[[610,285],[790,300],[785,410],[705,420],[608,415]],
 bedroom:[[300,40],[600,62],[600,215],[540,250],[300,222]],
 study:[[600,62],[850,95],[840,232],[800,300],[600,258]],
 bath:[[850,95],[1030,125],[1000,312],[800,300]],
 garden:[[1090,215],[1505,250],[1495,700],[1110,705],[1000,640],[1010,300]],
};
const pts=p=>p.map(q=>q.join(',')).join(' ');
const C=(n,x,y,w,o=1)=>`<img class="cloud" src="${A}map/cloud-${n}.webp" style="left:${x}px;top:${y}px;width:${w}px;opacity:${o}">`;
function fog(room,clouds,opacity=1){return `<g opacity="${opacity}"><polygon points="${pts(P[room])}" fill="#F3E7D6" opacity=".72" filter="url(#blur)"/></g>`}
function header(chapter,prog,stars,lv=1){return `
 <div class="top-l panel" style="border-radius:999px"><img src="${A}mansion/portrait-haru.webp" style="width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:0 0;border:3px solid #C9A46A;background:#F1E2C4;width:64px"/>
  <div><div style="font-size:13px;font-weight:700;color:#A0835F">하루의 저택 · Lv.${lv}</div><div class="serif" style="font-size:21px;font-weight:900">${chapter}</div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:3px"><div style="width:150px;height:8px;border-radius:9px;background:#E8D8BA;overflow:hidden"><div style="width:${prog}%;height:100%;background:#7E9A6A"></div></div><span style="font-size:12px;font-weight:800;color:#7A5A3A">${prog}%</span></div></div></div>
 <div class="top-r"><div class="chip" style="height:56px;padding:0 10px 0 8px;display:flex;align-items:center;gap:6px;font-size:24px;font-weight:900;color:#7A4E10"><img class="ico" style="width:38px;height:38px" src="${icon('sparkle')}">${stars}<span style="width:28px;height:28px;border-radius:50%;background:#7E9A6A;color:#fff;display:grid;place-items:center;font-size:18px">+</span></div>
 <div class="chip" style="width:56px;height:56px;display:grid;place-items:center"><img class="ico" style="width:36px;height:36px" src="${icon('gear')}"></div></div>`}
function menu(q=1){return `<div class="menu">
 <div class="m panel"><img class="ico" src="${icon('books')}">영어 학습</div>
 <div class="m panel"><img class="ico" src="${icon('scroll')}">퀘스트${q?'<span class="badge">'+q+'</span>':''}</div>
 <div class="m panel"><img class="ico" src="${icon('quill')}">학습 기록</div>
 <div class="m panel"><img class="ico" src="${icon('photo')}" style="width:42px">MY</div></div>`}
function roomsBar(on,unlocked){const R=[['거실','living'],['주방','kitchen'],['침실','bedroom'],['서재','study'],['욕실','bath'],['정원','garden']];
 return `<div class="rooms panel" style="border-radius:22px">${R.map(([n,k])=>{const u=unlocked.includes(k);return `<div class="room ${k===on?'on':''} ${u?'':'lock'}">${u?'':'<img src="'+icon('lock')+'" style="width:20px;height:20px">'}${n}<small>${k==='living'?(on==='living'?'진행 중':'완성'):u?'새로 해금':'잠김'}</small></div>`}).join('')}</div>`}

// ── 화면 1: 전체 저택 맵 (처음)
function screenMap(state){
 const done=state==='after';
 const locked=done?['bedroom','study','bath','garden']:['kitchen','bedroom','study','bath','garden'];
 const svg=`<svg class="full" viewBox="0 0 1536 864"><defs>
   <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter><filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
   <clipPath id="cl"><polygon points="${pts(P.living)}"/></clipPath>
   <radialGradient id="vig" cx="50%" cy="48%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#1c140c" stop-opacity=".55"/></radialGradient></defs>
   ${done?'':`<image href="${MAP}" width="1536" height="864" clip-path="url(#cl)" style="filter:grayscale(.4) sepia(.45) brightness(.82) contrast(.95)"/>
   <polygon points="${pts(P.living)}" fill="#6b5a44" opacity=".18"/>`}
   ${locked.map(r=>fog(r)).join('')}
   ${state==='after'?`<polygon points="${pts(P.kitchen)}" fill="#FFE9A8" opacity=".28"/><polygon points="${pts(P.kitchen)}" fill="none" stroke="#FFD86B" stroke-width="10" filter="url(#glow)"/><polygon points="${pts(P.kitchen)}" fill="none" stroke="#FFF1C2" stroke-width="3"/>`:
   `<polygon points="${pts(P.living)}" fill="none" stroke="#FFD86B" stroke-width="12" filter="url(#glow)"/><polygon points="${pts(P.living)}" fill="none" stroke="#FFF1C2" stroke-width="3.5"/>`}
   <rect width="1536" height="864" fill="url(#vig)"/></svg>`;
 const clouds=[];
 const cl={kitchen:[[2,560,250,280],[5,650,300,240]],bedroom:[[1,250,10,360],[4,380,90,300]],study:[[3,560,40,330],[6,650,120,280]],bath:[[2,820,70,270],[6,860,170,230]],garden:[[1,1050,230,330],[3,1220,350,340],[5,1080,470,330],[4,1260,190,300],[6,1200,560,320]]};
 for(const r of locked) for(const c of cl[r]) clouds.push(C(...c,.97));
 if(done){ // 주방 구름이 걷히는 순간
   clouds.push(C(2,470,230,280,.55),C(5,760,320,240,.45));
 }
 const L=(x,y,html,extra='')=>`<div class="label chip" style="left:${x}px;top:${y}px;${extra}">${html}</div>`;
 const lock=`<img src="${icon('lock')}">`;
 return `<div class="scr"><img class="full" src="${MAP}">${svg}${clouds.join('')}
  ${done?L(450,400,'거실 완성 <span style="color:#7E9A6A">✓ 11/11</span>'):L(430,330,'거실 <span style="color:#A0835F;font-size:13px">0/11 · 진행 중</span><span class="badge" style="position:static;width:24px;height:24px">!</span>','font-size:19px;border-width:3px')}
  ${done?L(700,330,'주방 해금!','background:linear-gradient(180deg,#F3D58C,#DDB467);font-size:20px;border-color:#fff;box-shadow:0 0 0 3px #C99A45,0 8px 20px rgba(0,0,0,.35)'):L(700,330,lock+'주방 <span style="font-size:12px;color:#A0835F">거실 완성 시</span>')}
  ${L(450,140,lock+'침실')}${L(720,170,lock+'서재')}${L(925,200,lock+'욕실')}${L(1290,450,lock+'정원')}
  ${header(done?'CH.02 주방의 암호':'CH.01 낡은 저택의 시작',done?0:0,done?3:0,done?2:1)}${menu(done?0:1)}${roomsBar(done?'kitchen':'living',done?['living','kitchen']:['living'])}
  <div class="panel" style="position:absolute;right:18px;bottom:16px;width:300px;padding:14px 18px;display:flex;align-items:center;gap:12px">
   <div style="flex:1"><div style="font-size:13px;font-weight:700;color:#A0835F">다음 목표</div><div class="serif" style="font-size:19px;font-weight:900">${done?'주방을 둘러봐요!':'거실을 새롭게 꾸며요!'}</div></div>
   <div class="btn-gold" style="width:52px;height:52px;display:grid;place-items:center;font-size:24px">▶</div></div>
  ${done?`<div class="panel serif" style="position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:12px 30px;font-size:24px;font-weight:900;text-align:center">✨ 새로운 공간이 열렸어요 — 주방 ✨<div style="font-family:sans-serif;font-size:14px;font-weight:700;color:#7A5A3A;margin-top:2px">구름이 걷히며 주방이 드러나요 (해금 애니메이션 중간 장면)</div></div>`:''}
 </div>`}

// ── 화면 3: 거실 확대
function screenRoom(){
 const tasks=[['청소','바닥 쓰레기 치우기',1,'now'],['청소','쌓인 먼지 제거',1,''],['청소','거미줄 제거',1,''],['청소','오래된 박스 정리',1,''],['수리','찢어진 벽지 교체',2,'lock'],['수리','바닥재 교체',2,'lock']];
 return `<div class="scr"><img class="full" src="${A}../../../art/figma-a/a-step0-before.png">
  <svg class="full" viewBox="0 0 1536 864"><defs><filter id="g2"><feGaussianBlur stdDeviation="5"/></filter></defs>
   <ellipse cx="1045" cy="590" rx="105" ry="62" fill="none" stroke="#FFD86B" stroke-width="10" filter="url(#g2)"/><ellipse cx="1045" cy="590" rx="105" ry="62" fill="none" stroke="#FFF4CC" stroke-width="3" stroke-dasharray="14 10"/>
   <ellipse cx="200" cy="700" rx="0" ry="0"/></svg>
  <div class="chip" style="position:absolute;left:1010px;top:500px;width:58px;height:58px;display:grid;place-items:center;font-size:30px;font-weight:900;background:#F3D58C;border:4px solid #FFF3D6;color:#5A3500">!</div>
  ${header('CH.01 거실 · STEP 0',0,3)}
  <div class="panel" style="position:absolute;right:18px;top:92px;width:360px;bottom:110px;padding:16px">
   <div class="serif" style="font-size:22px;font-weight:900;display:flex;justify-content:space-between;align-items:center">거실 리모델링<span style="font-family:sans-serif;font-size:15px;color:#7A5A3A">0 / 40</span></div>
   <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0">
    ${[['청소',0,7,1],['수리',0,7,0],['가구',0,14,0],['소품',0,12,0]].map(([n,a,b,on])=>`<div style="border-radius:14px;padding:6px 0;text-align:center;font-weight:800;font-size:15px;${on?'background:linear-gradient(180deg,#F3D58C,#DDB467);border:2px solid #fff;box-shadow:0 0 0 2px #C99A45':'background:#FFF8EA;border:2px solid #E3CFA6;color:#9C8A70'}">${n}<div style="font-size:11px">${a}/${b}</div></div>`).join('')}</div>
   ${tasks.map(([p,t,c,s])=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:7px;border-radius:14px;background:${s==='now'?'#FFF3D0':'#FFFBF2'};border:2px solid ${s==='now'?'#E2B85C':'#EADBC0'};${s==='lock'?'opacity:.55':''}">
     <span style="width:22px;height:22px;border-radius:6px;border:2px solid #C9A46A;display:grid;place-items:center">${s==='lock'?'<img src="'+icon('lock')+'" style="width:16px">':''}</span>
     <span style="flex:1;font-weight:800;font-size:16px">${t}</span><img src="${icon('sparkle')}" style="width:22px"><b>${c}</b></div>`).join('')}
   <div style="font-size:12px;color:#A0835F;text-align:center;margin-top:2px">지금 단계와 다음 작업만 보여요 · 진행하면 새 작업이 열려요</div>
   <div class="btn-gold serif" style="position:absolute;left:16px;right:16px;bottom:16px;height:62px;display:grid;place-items:center;font-size:24px">미션 시작 ▶</div></div>
  <div style="position:absolute;left:18px;bottom:18px;display:flex;gap:12px;align-items:end">
   <div class="chip" style="width:70px;height:70px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#6B4A2E">‹</div>
   <div class="btn-gold" style="width:120px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px"><img class="ico" src="${icon('hammer')}">미션</div>
   <div class="panel" style="width:120px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:900;opacity:.6;border-radius:22px"><img class="ico" src="${icon('armchair')}">가구 선택<span style="font-size:10px;color:#A0835F">가구 단계에서 열림</span></div>
   <div class="panel" style="width:120px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:900;border-radius:22px"><img class="ico" src="${icon('magnifier')}">전체 맵</div></div>
 </div>`}
const which=location.hash.slice(1)||'map';
document.getElementById('root').innerHTML= which==='map'?screenMap('before'): which==='unlock'?screenMap('after'): screenRoom();
</script></body></html>
